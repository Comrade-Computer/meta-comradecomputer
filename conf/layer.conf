# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-comradecomputer"
BBFILE_PATTERN_meta-comradecomputer = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-comradecomputer = "6"

LAYERDEPENDS_meta-comradecomputer = "core"
LAYERSERIES_COMPAT_meta-comradecomputer = "wrynose"
